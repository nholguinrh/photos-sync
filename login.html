<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Mom, Forever in Our Hearts</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
<main class="login-main">
  <section class="login-card">
    <p class="login-eyebrow">Mom, Forever in Our Hearts</p>
    <h1>Inicia sesión</h1>
    <p class="login-text">Accede con tu cuenta de Google para ver el álbum familiar. Después podrás elegir fotos de Google Photos para mostrarlas en las páginas.</p>
    <button id="google-signin" class="google-button" type="button">
      <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span>Continuar con Google</span>
    </button>
    <p id="login-status" class="login-status" role="status"></p>
    <p class="login-note">Las fotos se comparten solo cuando las eliges en el selector de Google Photos y no se guardan en este sitio.</p>
  </section>
</main>
<script src="auth.js" defer></script>
<script defer>
  document.addEventListener("DOMContentLoaded", function () {
    const button = document.querySelector("#google-signin");
    const status = document.querySelector("#login-status");
    const auth = window.SimonAuth;
    if (!button || !status || !auth) return;

    if (auth.isLoggedIn()) {
      location.replace("index.html");
      return;
    }

    const problem = auth.environmentProblem();
    if (problem) {
      status.textContent = problem;
      status.classList.add("is-error");
      if (auth.suggestedUrl && auth.suggestedUrl() !== location.href) {
        const link = document.createElement("a");
        link.href = auth.suggestedUrl();
        link.textContent = "Abrir en localhost";
        status.append(" ", link);
      }
      button.disabled = true;
      return;
    }

    if (!auth.isConfigured()) {
      status.textContent = "Falta configurar el Client ID de Google en auth.js.";
      status.classList.add("is-error");
      button.disabled = true;
      return;
    }

    button.addEventListener("click", async function () {
      button.disabled = true;
      status.textContent = "Conectando con Google...";
      status.classList.remove("is-error");
      try {
        await auth.signIn();
        location.replace("index.html");
      } catch (error) {
        status.textContent = "No se pudo iniciar sesión: " + (error.message || "error desconocido");
        status.classList.add("is-error");
        button.disabled = false;
      }
    });
  });
</script>
</body>
</html>
